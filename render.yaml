services:
  - type: web
    name: logistics-tracking-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    preDeployCommand: npm run migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: logistics-tracking-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        fromService:
          name: logistics-tracking-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: logistics-tracking-frontend
    runtime: static
    buildCommand: npm install && npm run build
    rootDir: frontend
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: logistics-tracking-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: logistics-tracking-db
    plan: free
